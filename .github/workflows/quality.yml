name: Quality Gate

# 品質閘門：單元測試 + Android Lint 必須綠燈；detekt 先當參考（advisory）。
# APK 建置仍在 build.yml，這裡不影響出包流程。
on:
  push:
    branches: [ main, master ]
  pull_request:
  workflow_dispatch:

jobs:
  test-and-lint:
    name: ${{ matrix.app }} · test + lint
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        app: [ ledger, gallery ]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
      - name: Unit tests
        working-directory: ${{ matrix.app }}
        run: gradle :app:testDebugUnitTest --no-daemon --stacktrace
      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-${{ matrix.app }}
          path: ${{ matrix.app }}/app/build/reports/tests/
          if-no-files-found: ignore
      - name: Android Lint
        working-directory: ${{ matrix.app }}
        run: gradle :app:lintDebug --no-daemon --stacktrace
      - name: Upload lint report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lint-${{ matrix.app }}
          path: ${{ matrix.app }}/app/build/reports/lint-results-debug.html
          if-no-files-found: ignore

  detekt:
    name: detekt (advisory)
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Run detekt CLI
        run: |
          curl -sSL -o detekt.jar https://github.com/detekt/detekt/releases/download/v1.23.6/detekt-cli-1.23.6-all.jar
          java -jar detekt.jar --input ledger/app/src/main,ledger/app/src/test \
            --build-upon-default-config --report txt:detekt.txt --report html:detekt.html || true
          echo "--- detekt findings ---"
          cat detekt.txt || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: detekt-report
          path: |
            detekt.txt
            detekt.html
          if-no-files-found: ignore
